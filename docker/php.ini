memory_limit = 256M
max_input_vars = 5000
post_max_size = 128M
upload_max_filesize = 128M
max_execution_time = 300
max_input_time = 300
zend.exception_ignore_args = On
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
